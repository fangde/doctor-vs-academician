<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11151c"><meta name="description" content="博士大战院士：左右移动，空格释放大招。保留参考形象的 2D 格斗游戏。"><title>博士大战院士 · 2D 对决</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2311151c'/%3E%3Cpath d='M6 9 20 22 34 9 26 28 14 28Z' fill='%236fe7e4'/%3E%3Ccircle cx='20' cy='28' r='4' fill='%23fff4da'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>
<main class="shell"><header class="topbar"><a class="wordmark" href="./" aria-label="博士大战院士首页"><span class="mark">博<span>士</span></span><span class="wordmark-sub">VS<br>院士</span></a><div class="edition">2D 格斗场 <span>/</span> 01</div><div class="toolbar"><button id="sound" class="icon-button" aria-label="开启音效" aria-pressed="false">音效 <span id="soundText">关</span></button><button id="pause" class="icon-button" disabled>暂停 <span>Ⅱ</span></button></div></header>
<section class="arena" aria-label="博士大战院士游戏区域"><div class="arena-top"><div class="fighter player"><div class="fighter-meta"><span>PLAYER 01</span><b id="playerNumbers">100 <small>/ 100</small></b></div><div class="fighter-name">博士 <small>机械羽翼</small></div><div class="hp-track" role="progressbar" aria-label="博士生命" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" id="playerHealth"><i></i></div></div><div class="round"><span>对决</span><strong id="timer">00:00</strong><small>ROUND 01</small></div><div class="fighter boss"><div class="fighter-meta"><b id="bossNumbers">240 <small>/ 240</small></b><span>BOSS</span></div><div class="fighter-name"><small>巨蟾</small> 院士</div><div class="hp-track" role="progressbar" aria-label="院士生命" aria-valuemin="0" aria-valuemax="240" aria-valuenow="240" id="bossHealth"><i></i></div></div></div>
<canvas id="game" width="1280" height="640" aria-label="博士与院士的二维战斗画面"></canvas><div class="battle-caption" id="caption" aria-live="polite">准备迎战</div><div class="arena-index">博士大战院士 <span> / </span> 空中对决</div>
<div class="overlay" id="overlay"><div class="intro-card"><span class="eyebrow" id="eyebrow">博士大战院士</span><h1 id="dialogTitle">这一战，<br>由你出招。</h1><p id="dialogText">左右飞行，避开攻击预警。<br>抓住距离，用大招击败院士。</p><button class="primary" id="start" disabled><span id="startLabel">角色载入中…</span><span>↗</span></button><div class="start-note" id="startNote">← → 移动 <span>·</span> 空格释放大招</div></div></div>
</section><section class="control-deck" aria-label="游戏操作"><div class="movement"><div class="key-buttons"><button id="left" aria-label="向左移动">←</button><button id="right" aria-label="向右移动">→</button></div><div><strong>左右移动</strong><span>自动悬停 · 避开红色预警</span></div></div><button class="ultimate" id="ultimate" disabled><span class="space-key">SPACE</span><span class="ult-copy"><strong id="ultLabel">大招就绪</strong><span>光炮 · 近身追加光剑</span></span><span class="ult-status" id="cooldownText">READY ↗</span><i id="cooldownFill"></i></button></section><footer><span>拉近距离，大招才能命中。</span><span>← → + 空格 <b>就够了</b></span></footer></main>
